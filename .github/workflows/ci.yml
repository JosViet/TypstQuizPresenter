name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Typst runtime smoke compile
        run: typst compile --root . tests/typst-smoke.typ /tmp/typst-smoke.pdf

      - name: Build
        run: npm run build
